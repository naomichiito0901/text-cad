name: build-test-deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 画面テストを Chromium / Firefox / WebKit で実行する。
  # STEP/STL/DXF/IFC の出力検証 (Python) は、ブラウザに依存しないため chromium の回だけ実行する。
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v7
        if: matrix.browser == 'chromium'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      # 依存の取得は、配布元の一時的な障害 (apt の 403 など) で止まらないよう、再試行する。
      # テストの実行 (下の Test) は再試行しない。 テストが本当に失敗したときは、そのまま失敗にして公開しない。
      - name: Install dependencies
        run: |
          bash tools/retry.sh 3 npm ci
          bash tools/ci-install-browser.sh ${{ matrix.browser }}

      - name: Install Python dependencies (出力検証用)
        if: matrix.browser == 'chromium'
        run: bash tools/retry.sh 3 pip install -r tests/requirements.txt

      - name: Build
        run: python3 build.py

      - name: Test (${{ matrix.browser }})
        env:
          BROWSER: ${{ matrix.browser }}
          CAD_OUT: ${{ runner.temp }}/cad-out
        run: bash tests/run_all.sh

      - name: Upload test outputs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-output-${{ matrix.browser }}
          path: ${{ runner.temp }}/cad-out
          retention-days: 7

  build-pages:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: bash tools/retry.sh 3 npm ci --ignore-scripts

      - run: python3 build.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build-pages
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
